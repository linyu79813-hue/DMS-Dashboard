<!doctype html><html lang="zh-Hant" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMS Dashboard V35</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script><style>:root{font-family:Arial,'Microsoft JhengHei',sans-serif;color:#1e293b;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dce2eb;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:21px;margin:0}small,.muted{color:#64748b}main{max-width:1450px;margin:auto;padding:18px}.panel{background:white;border:1px solid #dce2eb;border-radius:12px;padding:18px;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active,.primary{background:#bb2337;color:white;border-color:#bb2337}button,input,select{padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white}button{cursor:pointer}.primary{background:#bb2337;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.card{border:1px solid #e2e8f0;border-radius:10px;padding:15px}.card b{display:block;font-size:24px;margin-top:8px}.scroll{overflow:auto;max-height:60vh}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0}#app{display:none}#login{max-width:460px;margin:75px auto}#login input{display:block;width:100%;margin:10px 0}#message{padding:8px 0;color:#9f1239;white-space:pre-wrap}h2{font-size:19px}label{font-size:13px;margin-right:12px}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.note{font-size:12px;color:#64748b;line-height:1.7}details{margin:8px 0;padding:10px;border:1px solid #e2e8f0;border-radius:7px}summary{cursor:pointer}</style></head><body><header><div><h1>DMS Dashboard <span style="color:#bb2337">V35</span></h1><small>GitHub Pages × Supabase｜正式資料查詢</small></div><div id="who"></div></header><section id="login" class="panel"><h2>登入 DMS Dashboard</h2><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="密碼" autocomplete="current-password"><button id="signin" class="primary">登入</button><p id="loginMsg" class="note"></p></section><main id="app"><div class="panel row"><label>中心 <select id="center"></select></label><label>開始日期 <input type="date" id="from"></label><label>結束日期 <input type="date" id="to"></label><button id="refresh">查詢資料</button><button id="logout">登出</button><span id="status" class="note"></span></div><div class="tabs" id="tabs"></div><div id="page"></div><div id="admin" class="panel hidden"><h2>OP 資料匯入</h2><p class="note">僅接受 ByOrder DMS Excel，支援多檔分批匯入；僅上傳分析必要欄位，顧客電話與地址不會寫入資料庫。匯入時請勿關閉頁面。</p><input type="file" id="files" accept=".xlsx,.xls" multiple><button id="import" class="primary">匯入 DMS 訂單</button><p id="importStatus" class="note"></p><p class="note">Rider 工時匯入、歷史 KPI 自動彙總與 12 個月自動清理尚未啟用；請勿將此版視為全部功能驗收完成。</p></div></main><script src="app.js"></script></body></html>
